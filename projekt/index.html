<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Projektmappe</title>
<!--
  Delt projektmappe (booking-appens v895, src/projectShare.tsx, migration 061). Udgives med scripts/publish-reply-page.sh
  til GitHub Pages (Nlinck2222/booking-app-releases → /projekt/). Linket har ?k=<token>. Kun visning: siden kalder
  get_shared_project med den offentlige nøgle og får kun mappens rækker og bookinger — ingen kunder, priser eller noter.
  Kun tidslinjen (Nicolai: listen under behøves ikke) + zoom og scrubber. Henter igen hvert minut og når fanen får fokus. Dag-indeks fra mandag 30. dec 2024, som i appen.
-->
<style>
  :root { --bg: #f5f5f7; --card: #ffffff; --text: #1d1d1f; --muted: #6e6e73; --line: #e3e3e6; --grid: #eeeef0; --weekend: #f7f7f9;
          --today: #e5484d; --barText: #ffffff; --btn: #f0f0f2; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111113; --card: #1c1c1f; --text: #f5f5f7; --muted: #a1a1a6; --line: #2c2c30; --grid: #26262a; --weekend: #202024;
            --today: #ff6b6b; --barText: #ffffff; --btn: #2a2a2e; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  main { max-width: 1200px; margin: 0 auto; padding: 32px 16px 48px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; }
  .msg { max-width: 460px; margin: 40px auto; padding: 28px 24px; }
  header { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px 24px; margin: 0 0 16px; }
  .org { font-size: 13px; color: var(--muted); margin: 0 0 2px; }
  h1 { font-size: 22px; margin: 0; line-height: 1.25; }
  .sub { font-size: 13px; color: var(--muted); margin: 2px 0 0; }
  .nav { display: flex; align-items: center; gap: 6px; margin-left: auto; }
  .nav button { border: 1px solid var(--line); background: var(--btn); color: var(--text); border-radius: 6px; height: 30px; min-width: 30px; padding: 0 10px; font: inherit; font-weight: 600; cursor: pointer; }
  .nav .month { min-width: 150px; text-align: center; font-weight: 700; white-space: nowrap; }
  .zooms { display: flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; margin-right: 8px; }
  .nav .zooms button { border: none; border-radius: 0; background: transparent; height: 28px; min-width: 36px; padding: 0 8px; font-size: 12px; color: var(--muted); }
  .nav .zooms button + button { border-left: 1px solid var(--line); }
  .nav .zooms button.on { background: var(--btn); color: var(--text); }
  .months .mseg { flex: none; font-size: 11px; font-weight: 700; padding: 5px 8px; border-right: 1px solid var(--grid); white-space: nowrap; overflow: hidden; }
  .grid.tiny .day { border-right-color: transparent; }
  .grid.tiny .day.mon { box-shadow: inset 1px 0 0 var(--grid); }
  .mtiny { position: relative; z-index: 1; font-size: 10px; text-align: left; padding-left: 2px; white-space: nowrap; }
  .head .day { position: relative; }
  :root { color-scheme: light dark; }
  .scroller { overflow-x: auto; -webkit-overflow-scrolling: touch; background: var(--card); border-radius: 12px; }
  .grid { position: relative; min-width: max-content; }
  .head, .row { display: flex; border-bottom: 1px solid var(--line); }
  .row:last-child { border-bottom: none; }
  .label { position: sticky; left: 0; z-index: 3; flex: 0 0 150px; width: 150px; padding: 8px 12px; background: var(--card); border-right: 1px solid var(--line);
           display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 13px; overflow: hidden; }
  .label span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dot { flex: 0 0 9px; width: 9px; height: 9px; border-radius: 50%; }
  .dot.studio { border-radius: 2px; }
  .days { position: relative; display: flex; }
  .day { flex: 0 0 var(--dw); width: var(--dw); border-right: 1px solid var(--grid); }
  .day.we { background: var(--weekend); }
  .head .day { text-align: center; font-size: 11px; color: var(--muted); padding: 6px 0; line-height: 1.2; }
  .head .day b { display: block; font-size: 12px; color: var(--text); }
  .head .day.today b { color: var(--today); }
  .todayLine { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--today); opacity: .6; z-index: 2; pointer-events: none; }
  .bar { position: absolute; height: 24px; border-radius: 4px; color: var(--barText); font-size: 11px; font-weight: 600; padding: 0 7px;
         display: flex; align-items: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; z-index: 1;
         box-shadow: inset 0 -1px 0 rgba(0,0,0,.15); text-shadow: 0 1px 1px rgba(0,0,0,.25); }
  .bar .ep { opacity: .85; font-weight: 500; margin-left: 5px; }
  .empty { padding: 24px; color: var(--muted); }
  .scrub { margin-top: 12px; padding: 0 2px; touch-action: none; user-select: none; -webkit-user-select: none; }
  .strack { position: relative; height: 34px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); cursor: pointer; overflow: hidden; }
  .tick { position: absolute; top: 18px; height: 8px; border-radius: 2px; opacity: .85; }
  .smark { position: absolute; top: 3px; font-size: 10px; color: var(--muted); padding-left: 4px; border-left: 1px solid var(--line); height: 100%; white-space: nowrap; pointer-events: none; }
  .stoday { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--today); opacity: .7; pointer-events: none; }
  .sthumb { position: absolute; top: 0; bottom: 0; border: 2px solid var(--text); border-radius: 7px; background: rgba(127,127,127,.12); cursor: grab; box-sizing: border-box; min-width: 10px; }
  .scrub:active .sthumb { cursor: grabbing; }
  .foot { margin-top: 18px; font-size: 12px; color: var(--muted); }
  @media (max-width: 600px) {
    .label { flex-basis: 110px; width: 110px; padding: 8px; }
    .nav { margin-left: 0; width: 100%; flex-wrap: wrap; }
    .nav .month { flex: 1; min-width: 0; }
    .zooms { width: 100%; margin: 0 0 6px; }
    .nav .zooms button { flex: 1; }
  }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <div id="loading" class="card msg" style="color: var(--muted)">…</div>
  <div id="invalid" class="card msg" hidden>
    <h1 id="invalidTitle"></h1>
    <p class="sub" id="invalidText" style="font-size:14px; margin-top:8px"></p>
  </div>
  <div id="view" hidden>
    <header>
      <div>
        <p class="org" id="org"></p>
        <h1 id="folder"></h1>
        <p class="sub" id="project"></p>
      </div>
      <div class="nav">
        <div class="zooms" id="zooms"></div>
        <button id="prev" aria-label="‹">‹</button>
        <div class="month" id="month"></div>
        <button id="next" aria-label="›">›</button>
        <button id="today"></button>
      </div>
    </header>
    <div class="card scroller"><div class="grid" id="grid"></div></div>
    <div class="scrub" id="scrub"></div>
    <p class="foot" id="foot"></p>
  </div>
</main>
<script>
(() => {
  const SUPABASE_URL = 'https://roiwjhggrtmwppbaqxtd.supabase.co';
  const PUBLIC_KEY = 'sb_publishable_IzZ68IhECcV2T50QwpNqfg_vkfZxoZS';
  const params = new URLSearchParams(location.search);
  const token = params.get('k') || '';
  const lang = (params.get('l') || navigator.language || 'da').toLowerCase().startsWith('da') ? 'da' : 'en';
  document.documentElement.lang = lang;
  const T = {
    da: { invalidTitle: 'Linket virker ikke længere', invalidText: 'Det er måske stoppet eller udløbet. Kontakt den, der delte det med dig.',
          today: 'I dag', none: 'Ingen bookinger.', project: p => `Projekt: ${p}`,
          expires: d => `Linket udløber ${d}.`, readOnly: 'Kun visning. Siden opdaterer sig selv.', 
          months: ['Januar','Februar','Marts','April','Maj','Juni','Juli','August','September','Oktober','November','December'],
          wd: ['Ma','Ti','On','To','Fr','Lø','Sø'] },
    en: { invalidTitle: 'This link no longer works', invalidText: 'It may have been stopped or expired. Contact the person who shared it with you.',
          today: 'Today', none: 'No bookings.', project: p => `Project: ${p}`,
          expires: d => `The link expires ${d}.`, readOnly: 'View only. The page updates itself.', 
          months: ['January','February','March','April','May','June','July','August','September','October','November','December'],
          wd: ['Mo','Tu','We','Th','Fr','Sa','Su'] },
  }[lang];
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const EPOCH = new Date(2024, 11, 30);   // tidslinjens dag 0 (mandag), som booking-appen
  const dateOf = i => new Date(EPOCH.getFullYear(), EPOCH.getMonth(), EPOCH.getDate() + i);
  const indexOf = d => Math.round((new Date(d.getFullYear(), d.getMonth(), d.getDate()) - EPOCH) / 86400000);
  const mins = t => { if (!t) return null; const [h, m] = t.split(':').map(Number); return isNaN(h) ? null : h * 60 + (m || 0); };
  const LABEL_W = () => (window.innerWidth < 600 ? 110 : 150);

  // Zoom som i appen (Nicolai: "man skal kunne vælge hvor stort et view man vil se … som i appen med zoom knapperne").
  // Dagbredden fylder bredden ud; valget huskes i browseren
  const ZOOMS = [{ id: '7d', label: '7D' }, { id: '14d', label: '14D' }, { id: '1m', label: '1M' }, { id: '3m', label: '3M' }, { id: '6m', label: '6M' }];
  const lsGet = k => { try { return localStorage.getItem(k); } catch { return null; } };
  const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch {} };
  let zoom = ZOOMS.some(z => z.id === lsGet('projektZoom')) ? lsGet('projektZoom') : '1m';
  const months = z => ({ '1m': 1, '3m': 3, '6m': 6 }[z] || 0);
  // Periodens start (dag-indeks) for en dato: mandagen i ugen eller den 1. i måneden
  const periodStart = (d, z) => months(z) ? indexOf(new Date(d.getFullYear(), d.getMonth(), 1)) : indexOf(d) - ((d.getDay() + 6) % 7);
  // Efter scrubberen kan perioden starte midt i en måned — så bruges samme dato i måneden
  const periodLen = (i0, z) => { if (!months(z)) return z === '7d' ? 7 : 14; const d = dateOf(i0); return indexOf(new Date(d.getFullYear(), d.getMonth() + months(z), d.getDate())) - i0; };
  const shiftStart = (i0, z, dir) => { if (!months(z)) return i0 + dir * (z === '7d' ? 7 : 14); const d = dateOf(i0); return indexOf(new Date(d.getFullYear(), d.getMonth() + dir * months(z), d.getDate())); };

  let data = null;
  const now = new Date();
  let start = periodStart(now, zoom);

  const showInvalid = () => {
    $('loading').hidden = true; $('view').hidden = true; $('invalid').hidden = false;
    $('invalidTitle').textContent = T.invalidTitle; $('invalidText').textContent = T.invalidText; document.title = T.invalidTitle;
  };

  const load = async () => {
    if (!token) return showInvalid();
    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/get_shared_project`, {
        method: 'POST', headers: { apikey: PUBLIC_KEY, 'Content-Type': 'application/json' }, body: JSON.stringify({ p_token: token }),
      });
      if (!res.ok) throw new Error(res.status);
      const d = await res.json();
      if (!d) return showInvalid();
      const first = !data;
      data = d;
      if (first) {
        // Åbn ved den første kommende booking, hvis perioden er tom
        const n = periodLen(start, zoom), todayI = indexOf(now);
        const inView = d.bookings.some(b => b.start_day < start + n && b.start_day + Math.max(1, b.duration) > start);
        const next = d.bookings.find(b => b.start_day + b.duration > todayI);
        if (!inView && next) start = periodStart(dateOf(next.start_day), zoom);
      }
      render();
    } catch (e) {
      if (!data) showInvalid();
    }
  };

  const barText = b => `${esc(b.label || '')}${b.episode ? `<span class="ep">${esc(b.episode)}</span>` : ''}${b.work_type ? `<span class="ep">· ${esc(b.work_type)}</span>` : ''}`;
  const locale = lang === 'da' ? 'da-DK' : 'en-GB';
  const periodLabel = (i0, n) => {
    const a = dateOf(i0), z = dateOf(i0 + n - 1);
    const aligned = a.getDate() === 1;
    if (aligned && months(zoom) === 1) return `${T.months[a.getMonth()]} ${a.getFullYear()}`;
    if (aligned && months(zoom)) return `${T.months[a.getMonth()].slice(0, 3)}${a.getFullYear() !== z.getFullYear() ? ' ' + a.getFullYear() : ''} – ${T.months[z.getMonth()].slice(0, 3)} ${z.getFullYear()}`;
    return `${a.toLocaleDateString(locale, { day: 'numeric', month: 'short' })} – ${z.toLocaleDateString(locale, { day: 'numeric', month: 'short', year: 'numeric' })}`;
  };

  // Scrubber (Nicolai: "en scrubber i bunden"): hele projektets forløb med en streg pr. booking og et vindue for det
  // viste udsnit. Træk i vinduet, eller klik/træk på sporet. Spænder fra første til sidste booking (og i dag) ± 2 uger
  const span = () => {
    const todayI = indexOf(now);
    let a = todayI, z = todayI;
    for (const b of data.bookings) { a = Math.min(a, b.start_day); z = Math.max(z, b.start_day + Math.max(1, b.duration)); }
    return { a: a - 14, z: z + 14 };
  };
  const renderScrubber = (i0, n) => {
    const { a, z } = span(), total = Math.max(1, z - a);
    const pct = i => ((i - a) / total) * 100;
    const rowColor = Object.fromEntries(data.rows.map(r => [r.id, r.color]));
    const ticks = data.bookings.map(b => `<div class="tick" style="left:${pct(b.start_day)}%;width:max(2px, ${(Math.max(1, b.duration) / total) * 100}%);background:${esc(b.color || rowColor[b.row_id] || '#888')}"></div>`).join('');
    const todayI = indexOf(now);
    // Månedsmærker langs sporet
    let marks = '', d = dateOf(a); d = new Date(d.getFullYear(), d.getMonth() + 1, 1);
    const every = total > 400 ? 3 : 1;
    for (; indexOf(d) < z; d = new Date(d.getFullYear(), d.getMonth() + every, 1)) {
      marks += `<div class="smark" style="left:${pct(indexOf(d))}%">${esc(T.months[d.getMonth()].slice(0, 3))}${d.getMonth() === 0 ? ' ' + d.getFullYear() : ''}</div>`;
    }
    const left = Math.max(0, Math.min(100, pct(i0))), width = Math.min(100 - left, (n / total) * 100);
    $('scrub').innerHTML = `<div class="strack" id="strack">${marks}${ticks}<div class="stoday" style="left:${pct(todayI)}%"></div><div class="sthumb" id="sthumb" style="left:${left}%;width:${width}%"></div></div>`;
  };
  // Træk: vinduets midte følger musen/fingeren
  let scrubbing = false, raf = 0;
  const scrubTo = clientX => {
    const track = $('strack'); if (!track || !data) return;
    const rect = track.getBoundingClientRect(), { a, z } = span();
    const n = periodLen(start, zoom);
    const day = a + ((clientX - rect.left) / rect.width) * (z - a);
    start = Math.round(Math.max(a, Math.min(z - n, day - n / 2)));
    cancelAnimationFrame(raf); raf = requestAnimationFrame(render);
  };
  $('scrub').addEventListener('pointerdown', e => { if (!e.target.closest('.strack')) return; scrubbing = true; e.currentTarget.setPointerCapture(e.pointerId); scrubTo(e.clientX); });
  $('scrub').addEventListener('pointermove', e => { if (scrubbing) scrubTo(e.clientX); });
  $('scrub').addEventListener('pointerup', () => { scrubbing = false; });
  $('scrub').addEventListener('pointercancel', () => { scrubbing = false; });

  const render = () => {
    $('loading').hidden = true; $('invalid').hidden = true; $('view').hidden = false;
    document.title = data.folder;
    $('org').textContent = data.organization || '';
    $('folder').textContent = data.folder;
    $('project').textContent = data.project && data.project !== data.folder ? T.project(data.project) : '';
    $('today').textContent = T.today;
    $('zooms').innerHTML = ZOOMS.map(z => `<button data-z="${z.id}" class="${z.id === zoom ? 'on' : ''}">${z.label}</button>`).join('');

    const i0 = start, n = periodLen(start, zoom), todayI = indexOf(now);
    $('month').textContent = periodLabel(i0, n);
    const sc = document.querySelector('.scroller');
    const DW = Math.max(4, (sc.clientWidth - LABEL_W() - 1) / n);
    const mode = DW >= 26 ? 'full' : DW >= 16 ? 'num' : 'tiny';
    const rowColor = Object.fromEntries(data.rows.map(r => [r.id, r.color]));
    const visible = data.bookings.filter(b => b.start_day <= i0 + n - 1 && b.start_day + Math.max(1, b.duration) - 1 >= i0);
    const dayCells = h => { let d = ''; for (let k = 0; k < n; k++) { const wd = (dateOf(i0 + k).getDay() + 6) % 7; d += `<div class="day${wd >= 5 ? ' we' : ''}${wd === 0 ? ' mon' : ''}" style="height:${h}px"></div>`; } return d; };

    // Måneder over dagene, når perioden går over flere måneder (eller er kort)
    let monthRow = '';
    if (months(zoom) !== 1) {
      let k = 0, segs = '';
      while (k < n) {
        const d = dateOf(i0 + k), next = indexOf(new Date(d.getFullYear(), d.getMonth() + 1, 1)) - i0, len = Math.min(n, next) - k;
        segs += `<div class="mseg" style="width:${len * DW}px">${len * DW > 50 ? esc(`${T.months[d.getMonth()]} ${d.getFullYear()}`) : ''}</div>`;
        k += len;
      }
      monthRow = `<div class="head months"><div class="label"></div><div class="days">${segs}</div></div>`;
    }
    let head = `<div class="head"><div class="label"></div><div class="days">`;
    for (let k = 0; k < n; k++) {
      const d = dateOf(i0 + k), wd = (d.getDay() + 6) % 7;
      const txt = mode === 'full' ? `${T.wd[wd]}<b>${d.getDate()}</b>` : mode === 'num' ? `<b>${d.getDate()}</b>` : (wd === 0 ? `<b class="mtiny">${d.getDate()}</b>` : '');
      head += `<div class="day${wd >= 5 ? ' we' : ''}${wd === 0 ? ' mon' : ''}${i0 + k === todayI ? ' today' : ''}">${txt}</div>`;
    }
    head += `</div></div>`;

    // En række pr. række i mappen; en booking med kobling vises også på den koblede række (som i appen)
    let rows = '';
    for (const r of data.rows) {
      const list = visible.filter(b => b.row_id === r.id || b.linked_row_id === r.id).map(b => {
        const sM = mins(b.start_time), eM = mins(b.end_time);
        const s = b.start_day + (sM != null ? sM / 1440 : 0);
        const e = b.start_day + Math.max(1, b.duration) - 1 + (eM != null ? eM / 1440 : 1);
        return { b, s: Math.max(s, i0), e: Math.min(e, i0 + n) };
      }).sort((a, c) => a.s - c.s);
      // Spor, så overlappende bookinger ligger under hinanden
      const lanes = [];
      for (const x of list) { let l = lanes.findIndex(end => end <= x.s + 1e-6); if (l < 0) { l = lanes.length; lanes.push(0); } lanes[l] = x.e; x.lane = l; }
      const h = Math.max(1, lanes.length) * 28 + 8;
      const bars = list.map(x => {
        const color = x.b.color || rowColor[x.b.row_id] || '#888888';
        const left = (x.s - i0) * DW + 1, width = Math.max(4, (x.e - x.s) * DW - 2);
        return `<div class="bar" style="left:${left}px;width:${width}px;top:${6 + x.lane * 28}px;background:${esc(color)};${width < 26 ? 'padding:0' : ''}" title="${esc([x.b.label, x.b.episode, x.b.work_type].filter(Boolean).join(' · '))}">${width >= 26 ? barText(x.b) : ''}</div>`;
      }).join('');
      const line = todayI >= i0 && todayI < i0 + n ? `<div class="todayLine" style="left:${(todayI - i0 + (now.getHours() * 60 + now.getMinutes()) / 1440) * DW}px"></div>` : '';
      rows += `<div class="row"><div class="label"><span class="dot${r.category === 'studio' ? ' studio' : ''}" style="background:${esc(r.color || '#888')}"></span><span>${esc(r.label)}</span></div><div class="days">${dayCells(h)}${bars}${line}</div></div>`;
    }
    // En tom række under den sidste (Nicolai), samme højde som en række med én bjælke
    if (data.rows.length) rows += `<div class="row"><div class="label"></div><div class="days">${dayCells(36)}</div></div>`;
    const grid = $('grid');
    grid.style.setProperty('--dw', DW + 'px');
    grid.className = `grid ${mode}`;
    grid.innerHTML = monthRow + head + (data.rows.length ? rows : `<div class="empty">${T.none}</div>`);

    renderScrubber(i0, n);
    $('foot').textContent = [T.readOnly, data.expires_at ? T.expires(new Date(data.expires_at).toLocaleDateString(locale, { day: 'numeric', month: 'long', year: 'numeric' })) : ''].filter(Boolean).join(' ');
  };

  $('prev').onclick = () => { start = shiftStart(start, zoom, -1); render(); };
  $('next').onclick = () => { start = shiftStart(start, zoom, 1); render(); };
  $('today').onclick = () => { start = periodStart(now, zoom); render(); };
  $('zooms').onclick = e => {
    const z = e.target.closest('button')?.dataset.z;
    if (!z || z === zoom) return;
    // Bliv omkring det sted, man kigger på (i dag, hvis det er i perioden)
    const n = periodLen(start, zoom), todayI = indexOf(now);
    const anchor = todayI >= start && todayI < start + n ? now : dateOf(start);
    zoom = z; lsSet('projektZoom', z); start = periodStart(anchor, zoom); render();
  };
  let rt; window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => data && render(), 120); });

  load();
  setInterval(load, 60000);
  window.addEventListener('focus', load);
})();
</script>
</body>
</html>
