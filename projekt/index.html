<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Projektmappe</title>
<script>try { var t = localStorage.getItem('projektTheme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}</script>
<!--
  Delt projektmappe (booking-appens v895, src/projectShare.tsx, migration 061). Udgives med scripts/publish-reply-page.sh
  til GitHub Pages (Nlinck2222/booking-app-releases → /projekt/). Linket har ?k=<token>. Kun visning: siden kalder
  get_shared_project med den offentlige nøgle og får kun mappens rækker og bookinger — ingen kunder, priser eller noter.
  Kun tidslinjen (Nicolai: listen under behøves ikke) + zoom og scrubber. Henter igen hvert minut og når fanen får fokus. Dag-indeks fra mandag 30. dec 2024, som i appen.
-->
<style>
  /* Tonerne som i appen (2026-11-15, src/theme.ts): --bg/--label = sidebarBg, --card = gridBg, --head = headerBg,
     --dayHead = timelineDayBg, --line = sidebarLine, --grid = gridLine, --weekendLine = weekendBorderColor, --btn = btnNormalBg */
  :root { --bg: #dfdfde; --card: #c5c5c4; --label: #dfdfde; --head: #dfdfde; --dayHead: #c8c8c7; --text: #3c3728; --muted: #89867e;
          --line: rgba(0, 0, 0, 0.2); --grid: rgba(0, 0, 0, 0.1); --weekendLine: rgba(77, 67, 35, 0.2); --btnBorder: rgba(0, 0, 0, 0.15);
          --barText: #ffffff; --btn: #ffffff;
          --tabBg: #dfdfde; --tabActiveBg: #c4c4c4; --tabBorder: rgba(0, 0, 0, 0.51); --tabText: #7d7a73; --tabActiveText: #3c3728;
          --tabShadow: 0 1px 2px rgba(0, 0, 0, 0.43);
          --hourLine: rgba(0, 0, 0, 0.08); --hourLineHead: rgba(0, 0, 0, 0.1);
          /* Nu-linjen som i appen (theme.ts playheadLineTimeline/-Glow): blå i lyst tema, lys gul i mørkt (2026-11-15);
             også dagens dato og i dag-stregen i scrubberen */
          --now: #0077ff; --nowGlow: rgba(0, 0, 0, 0.3); }
  /* Tema (2026-11-15, Nicolai): følger computeren, indtil man vælger med knappen øverst; valget huskes i browseren */
  :root { color-scheme: light; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #373636; --card: #242323; --label: #373636; --head: #373636; --dayHead: #282727; --text: #e0e0e0; --muted: #818181;
            --line: rgba(35, 32, 32, 0.75); --grid: rgba(255, 255, 255, 0.05); --weekendLine: rgba(122, 166, 224, 0.4); --btnBorder: rgba(255, 255, 255, 0.05);
            --barText: #ffffff; --btn: #282828;
            --tabBg: #3b3b3b; --tabActiveBg: #afafaf; --tabBorder: #222222; --tabText: #c0c0c0; --tabActiveText: #222222;
            --tabShadow: 0 0 12px 1px rgba(0, 0, 0, 0.36);
            --hourLine: rgba(255, 255, 255, 0.03); --hourLineHead: rgba(255, 255, 255, 0.05); --now: #fff0c0; --nowGlow: #fff9e7; color-scheme: dark; }
  }
  :root[data-theme="dark"] { --bg: #373636; --card: #242323; --label: #373636; --head: #373636; --dayHead: #282727; --text: #e0e0e0; --muted: #818181;
            --line: rgba(35, 32, 32, 0.75); --grid: rgba(255, 255, 255, 0.05); --weekendLine: rgba(122, 166, 224, 0.4); --btnBorder: rgba(255, 255, 255, 0.05);
            --barText: #ffffff; --btn: #282828;
            --tabBg: #3b3b3b; --tabActiveBg: #afafaf; --tabBorder: #222222; --tabText: #c0c0c0; --tabActiveText: #222222;
            --tabShadow: 0 0 12px 1px rgba(0, 0, 0, 0.36);
            --hourLine: rgba(255, 255, 255, 0.03); --hourLineHead: rgba(255, 255, 255, 0.05); --now: #fff0c0; --nowGlow: #fff9e7; color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  /* Bredden følger vinduet (2026-11-15, Nicolai): passer på den mindste MacBook (1280 punkter), vokser på større skærme */
  main { max-width: 1680px; margin: 0 auto; padding: 32px 16px 48px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; }
  .msg { max-width: 460px; margin: 40px auto; padding: 28px 24px; }
  header { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px 24px; margin: 0 0 16px; }
  .org { font-size: 13px; color: var(--muted); margin: 0 0 2px; }
  h1 { font-size: 22px; margin: 0; line-height: 1.25; }
  .sub { font-size: 13px; color: var(--muted); margin: 2px 0 0; }
  .nav { display: flex; align-items: center; gap: 6px; margin-left: auto; }
  .nav button { border: 1px solid var(--tabBorder); background: var(--tabBg); color: var(--tabText); border-radius: 6px; height: 30px; min-width: 30px; padding: 0 10px; font: inherit; font-weight: 600; cursor: pointer; }
  .nav .month { min-width: 150px; text-align: center; font-weight: 700; white-space: nowrap; }
  .zooms { display: flex; border: 1px solid var(--tabBorder); border-radius: 6px; overflow: hidden; margin-right: 8px; }
  /* Zoomknapperne som appens (TimelineArea, tab-farverne i theme.ts) */
  .nav .zooms button { border: none; border-radius: 0; background: var(--tabBg); height: 28px; min-width: 36px; padding: 0 8px; font-size: 12px; color: var(--tabText); }
  .nav .zooms button + button { border-left: 1px solid var(--tabBorder); }
  .nav .zooms button.on { background: var(--tabActiveBg); color: var(--tabActiveText); box-shadow: var(--tabShadow); position: relative; }
  /* Måneds- og ugerækken (2026-11-15, Nicolai): som i appen — "NOV 26" og kun ugenummeret, venstrestillet */
  .months .mseg, .weeks .mseg { flex: none; font-size: 10px; font-weight: 600; letter-spacing: .06em; color: var(--muted); padding: 5px 6px;
         border-right: 1px solid var(--line); white-space: nowrap; overflow: hidden; }
  .grid.tiny .day { border-right-color: transparent; }
  .grid.tiny .day.mon { box-shadow: inset 1px 0 0 var(--grid); }
  .head .day { position: relative; }
  .scroller { overflow-x: auto; -webkit-overflow-scrolling: touch; background: var(--card); border-radius: 12px; }
  .grid { position: relative; min-width: max-content; }
  .head, .row { display: flex; border-bottom: 1px solid var(--line); }
  .head { background: var(--head); }
  .head:not(.months):not(.weeks) { background: var(--dayHead); }
  .row:last-child { border-bottom: none; }
  .label { position: sticky; left: 0; z-index: 3; flex: 0 0 150px; width: 150px; padding: 8px 12px; background: var(--label); border-right: 1px solid var(--line);
           display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 13px; overflow: hidden; }
  .label span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dot { flex: 0 0 9px; width: 9px; height: 9px; border-radius: 50%; }
  .dot.studio { border-radius: 2px; }
  .days { position: relative; display: flex; }
  .day { flex: 0 0 var(--dw); width: var(--dw); border-right: 1px solid var(--grid); }
  /* Weekenden som i appen: ingen baggrund, en streg efter fredag og søndag (getDayStyle) */
  .day.fri, .day.sun { border-right-color: var(--weekendLine); }
  /* 1D som i appen (gridBg1D/gridHeader1D, DayHours1D): en streg pr. time, datoen øverst til venstre, timerne nederst */
  .grid.h1d .row .day { background-image: var(--hours); }
  .grid.h1d .head:not(.months):not(.weeks) .day { background-image: var(--hoursHead); height: 40px; padding: 0; position: relative; overflow: hidden; }
  .h1date { position: absolute; top: 6px; left: calc(var(--dw) / 48); transform: translateX(-50%); font-size: 14px; font-weight: 800; color: var(--text); }
  .h1hour { position: absolute; bottom: 4px; transform: translateX(-50%); font-size: 9px; font-weight: 600; color: var(--muted); }
  .head .day { text-align: center; font-size: 11px; color: var(--muted); padding: 6px 0; line-height: 1.2; }
  .head .day b { display: block; font-size: 12px; color: var(--text); }
  .head .day.today b { color: var(--now); }
  .todayLine { position: absolute; top: 0; bottom: 0; width: 1px; transform: translateX(-50%); background: var(--now); box-shadow: 0 0 2px var(--nowGlow); z-index: 2; pointer-events: none; }
  /* Bjælkehøjden (2026-11-15, Nicolai): højere end før (24), lidt lavere end appens ~38 */
  .bar { position: absolute; height: 32px; border-radius: 4px; color: var(--barText); font-size: 11px; font-weight: 600; padding: 0 7px;
         display: flex; align-items: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; z-index: 1;
         box-shadow: inset 0 -1px 0 rgba(0,0,0,.15); text-shadow: 0 1px 1px rgba(0,0,0,.25); }
  .bar .ep { opacity: .85; font-weight: 500; margin-left: 5px; }
  .empty { padding: 24px; color: var(--muted); }
  .scrub { margin-top: 12px; padding: 0 2px; touch-action: none; user-select: none; -webkit-user-select: none; }
  .strack { position: relative; height: 34px; border: 1px solid var(--line); border-radius: 8px; background: var(--head); cursor: pointer; overflow: hidden; }
  .tick { position: absolute; top: 18px; height: 8px; border-radius: 2px; opacity: .85; }
  .smark { position: absolute; top: 3px; font-size: 10px; color: var(--muted); padding-left: 4px; border-left: 1px solid var(--line); height: 100%; white-space: nowrap; pointer-events: none; }
  .stoday { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--now); box-shadow: 0 0 2px var(--nowGlow); pointer-events: none; }
  .sthumb { position: absolute; top: 0; bottom: 0; border: 2px solid var(--text); border-radius: 7px; background: rgba(127,127,127,.12); cursor: grab; box-sizing: border-box; min-width: 10px; }
  .scrub:active .sthumb { cursor: grabbing; }
  .foot { margin-top: 18px; font-size: 12px; color: var(--muted); }
  @media (max-width: 600px) {
    .label { flex-basis: 110px; width: 110px; padding: 8px; }
    .nav { margin-left: 0; width: 100%; flex-wrap: wrap; }
    .nav .month { flex: 1; min-width: 0; }
    .zooms { width: 100%; margin: 0 0 6px; }
    .nav .zooms button { flex: 1; }
  }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <div id="loading" class="card msg" style="color: var(--muted)">…</div>
  <div id="invalid" class="card msg" hidden>
    <h1 id="invalidTitle"></h1>
    <p class="sub" id="invalidText" style="font-size:14px; margin-top:8px"></p>
  </div>
  <div id="view" hidden>
    <header>
      <div>
        <p class="org" id="org"></p>
        <h1 id="folder"></h1>
        <p class="sub" id="project"></p>
      </div>
      <div class="nav">
        <div class="zooms" id="zooms"></div>
        <button id="prev" aria-label="‹">‹</button>
        <div class="month" id="month"></div>
        <button id="next" aria-label="›">›</button>
        <button id="today"></button>
        <button id="theme"></button>
      </div>
    </header>
    <div class="card scroller"><div class="grid" id="grid"></div></div>
    <div class="scrub" id="scrub"></div>
    <p class="foot" id="foot"></p>
  </div>
</main>
<script>
(() => {
  const SUPABASE_URL = 'https://roiwjhggrtmwppbaqxtd.supabase.co';
  const PUBLIC_KEY = 'sb_publishable_IzZ68IhECcV2T50QwpNqfg_vkfZxoZS';
  const params = new URLSearchParams(location.search);
  const token = params.get('k') || '';
  const lang = (params.get('l') || navigator.language || 'da').toLowerCase().startsWith('da') ? 'da' : 'en';
  document.documentElement.lang = lang;
  const T = {
    da: { invalidTitle: 'Linket virker ikke længere', invalidText: 'Det er måske stoppet eller udløbet. Kontakt den, der delte det med dig.',
          today: 'I dag', none: 'Ingen bookinger.', light: 'Lyst tema', dark: 'Mørkt tema', project: p => `Projekt: ${p}`,
          expires: d => `Linket udløber ${d}.`, readOnly: 'Kun visning. Siden opdaterer sig selv.', 
          months: ['Januar','Februar','Marts','April','Maj','Juni','Juli','August','September','Oktober','November','December'],
          mShort: ['JAN','FEB','MAR','APR','MAJ','JUN','JUL','AUG','SEP','OKT','NOV','DEC'] },
    en: { invalidTitle: 'This link no longer works', invalidText: 'It may have been stopped or expired. Contact the person who shared it with you.',
          today: 'Today', none: 'No bookings.', light: 'Light theme', dark: 'Dark theme', project: p => `Project: ${p}`,
          expires: d => `The link expires ${d}.`, readOnly: 'View only. The page updates itself.', 
          months: ['January','February','March','April','May','June','July','August','September','October','November','December'],
          mShort: ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'] },
  }[lang];
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const EPOCH = new Date(2024, 11, 30);   // tidslinjens dag 0 (mandag), som booking-appen
  const dateOf = i => new Date(EPOCH.getFullYear(), EPOCH.getMonth(), EPOCH.getDate() + i);
  const indexOf = d => Math.round((new Date(d.getFullYear(), d.getMonth(), d.getDate()) - EPOCH) / 86400000);
  const mins = t => { if (!t) return null; const [h, m] = t.split(':').map(Number); return isNaN(h) ? null : h * 60 + (m || 0); };
  const LABEL_W = () => (window.innerWidth < 600 ? 110 : 150);

  // Zoom som i appen (Nicolai: "man skal kunne vælge hvor stort et view man vil se … som i appen med zoom knapperne").
  // Dagbredden fylder bredden ud; valget huskes i browseren
  // Lyst/mørkt (2026-11-15): knappen viser det tema, man skifter til
  const darkNow = () => document.documentElement.dataset.theme ? document.documentElement.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  const paintThemeBtn = () => { const b = $('theme'); const d = darkNow(); b.textContent = d ? '☀' : '☾'; b.title = d ? T.light : T.dark; b.setAttribute('aria-label', b.title); };
  const ZOOMS = [{ id: '1d', label: '1D' }, { id: '7d', label: '7D' }, { id: '14d', label: '14D' }, { id: '1m', label: '1M' }, { id: '3m', label: '3M' }, { id: '6m', label: '6M' }];
  const lsGet = k => { try { return localStorage.getItem(k); } catch { return null; } };
  const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch {} };
  if (['light', 'dark'].includes(lsGet('projektTheme'))) document.documentElement.dataset.theme = lsGet('projektTheme');
  paintThemeBtn();
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', paintThemeBtn);
  $('theme').onclick = () => { const t = darkNow() ? 'light' : 'dark'; document.documentElement.dataset.theme = t; lsSet('projektTheme', t); paintThemeBtn(); };
  let zoom = ZOOMS.some(z => z.id === lsGet('projektZoom')) ? lsGet('projektZoom') : '1m';
  const months = z => ({ '1m': 1, '3m': 3, '6m': 6 }[z] || 0);
  // Periodens start (dag-indeks) for en dato: mandagen i ugen eller den 1. i måneden
  const days = z => ({ '1d': 1, '7d': 7, '14d': 14 }[z]);
  const periodStart = (d, z) => months(z) ? indexOf(new Date(d.getFullYear(), d.getMonth(), 1)) : z === '1d' ? indexOf(d) : indexOf(d) - ((d.getDay() + 6) % 7);
  // Efter scrubberen kan perioden starte midt i en måned — så bruges samme dato i måneden
  const periodLen = (i0, z) => { if (!months(z)) return days(z); const d = dateOf(i0); return indexOf(new Date(d.getFullYear(), d.getMonth() + months(z), d.getDate())) - i0; };
  const shiftStart = (i0, z, dir) => { if (!months(z)) return i0 + dir * days(z); const d = dateOf(i0); return indexOf(new Date(d.getFullYear(), d.getMonth() + dir * months(z), d.getDate())); };

  let data = null;
  const now = new Date();
  let start = periodStart(now, zoom);

  const showInvalid = () => {
    $('loading').hidden = true; $('view').hidden = true; $('invalid').hidden = false;
    $('invalidTitle').textContent = T.invalidTitle; $('invalidText').textContent = T.invalidText; document.title = T.invalidTitle;
  };

  const load = async () => {
    if (!token) return showInvalid();
    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/get_shared_project`, {
        method: 'POST', headers: { apikey: PUBLIC_KEY, 'Content-Type': 'application/json' }, body: JSON.stringify({ p_token: token }),
      });
      if (!res.ok) throw new Error(res.status);
      const d = await res.json();
      if (!d) return showInvalid();
      const first = !data;
      data = d;
      if (first) {
        // Åbn ved den første kommende booking, hvis perioden er tom
        const n = periodLen(start, zoom), todayI = indexOf(now);
        const inView = d.bookings.some(b => b.start_day < start + n && b.start_day + Math.max(1, b.duration) > start);
        const next = d.bookings.find(b => b.start_day + b.duration > todayI);
        if (!inView && next) start = periodStart(dateOf(next.start_day), zoom);
      }
      render();
    } catch (e) {
      if (!data) showInvalid();
    }
  };

  // Bjælketeksten som i appen (bookingBarText i src/uiParts.tsx): øjnene i booking-fanen styrer navn, projekt og arbejdstype;
  // Ferie/Fri kun navnet; Møde/Visning med typen forrest. Rækkefølgen er appens standard (den valgte gemmes kun lokalt i appen)
  // Initialer (migration 073): personrækkens initialer, når øjet ved Tildel er tændt; ikke sat → ud fra navnet (rowInitials)
  const rowInitials = label => {
    const words = (label || '').split(/[\s-]+/).filter(Boolean);
    if (words.length === 1 && !/^\d+$/.test(words[0])) return words[0].slice(0, 2).toUpperCase();
    return words.slice(0, 3).map(w => /^\d+$/.test(w) ? w : w[0].toUpperCase()).join('');
  };
  const initialsOf = id => { const r = data.rows.find(x => x.id === id && x.category === 'person'); return r ? ((r.initials || '').toUpperCase() || rowInitials(r.label)) : undefined; };
  const barParts = b => {
    if (b.type === 'Ferie' || b.type === 'Fri') return [b.label].filter(Boolean);
    const lead = b.type === 'Møde' || b.type === 'Visning' ? b.type : '';
    const name = b.show_name !== false ? b.label : '';
    // Samlet projekt (v849): delen har intet navn, så kun projektet står der — som i appen
    const ep = b.show_project !== false && b.episode_id ? [data.project, b.episode].filter(Boolean).join(' · ') : '';
    const person = b.show_initials ? (initialsOf(b.row_id) ?? (b.linked_row_id ? initialsOf(b.linked_row_id) : '')) : '';
    const wt = b.show_work_type !== false && b.work_type ? b.work_type : '';
    return [lead, name, ep, person, wt].filter(Boolean);
  };
  const barText = b => barParts(b).map((p, i) => i ? `<span class="ep">· ${esc(p)}</span>` : esc(p)).join('');
  // Ugenummer (ISO), som getWeekNumber i appen
  const isoWeek = d => { const t = new Date(d.getFullYear(), d.getMonth(), d.getDate() - ((d.getDay() + 6) % 7) + 3); const y = new Date(t.getFullYear(), 0, 4);
    return 1 + Math.round(((t - y) / 86400000 - 3 + ((y.getDay() + 6) % 7)) / 7); };
  const locale = lang === 'da' ? 'da-DK' : 'en-GB';
  const periodLabel = (i0, n) => {
    const a = dateOf(i0), z = dateOf(i0 + n - 1);
    if (n === 1) return a.toLocaleDateString(locale, { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
    const aligned = a.getDate() === 1;
    if (aligned && months(zoom) === 1) return `${T.months[a.getMonth()]} ${a.getFullYear()}`;
    if (aligned && months(zoom)) return `${T.months[a.getMonth()].slice(0, 3)}${a.getFullYear() !== z.getFullYear() ? ' ' + a.getFullYear() : ''} – ${T.months[z.getMonth()].slice(0, 3)} ${z.getFullYear()}`;
    return `${a.toLocaleDateString(locale, { day: 'numeric', month: 'short' })} – ${z.toLocaleDateString(locale, { day: 'numeric', month: 'short', year: 'numeric' })}`;
  };

  // Scrubber (Nicolai: "en scrubber i bunden"): hele projektets forløb med en streg pr. booking og et vindue for det
  // viste udsnit. Træk i vinduet, eller klik/træk på sporet. Spænder fra første til sidste booking (og i dag) ± 2 uger
  const span = () => {
    const todayI = indexOf(now);
    let a = todayI, z = todayI;
    for (const b of data.bookings) { a = Math.min(a, b.start_day); z = Math.max(z, b.start_day + Math.max(1, b.duration)); }
    return { a: a - 14, z: z + 14 };
  };
  const renderScrubber = (i0, n) => {
    const { a, z } = span(), total = Math.max(1, z - a);
    const pct = i => ((i - a) / total) * 100;
    const rowColor = Object.fromEntries(data.rows.map(r => [r.id, r.color]));
    const ticks = data.bookings.map(b => `<div class="tick" style="left:${pct(b.start_day)}%;width:max(2px, ${(Math.max(1, b.duration) / total) * 100}%);background:${esc(b.color || rowColor[b.row_id] || '#888')}"></div>`).join('');
    const todayI = indexOf(now);
    // Månedsmærker langs sporet
    let marks = '', d = dateOf(a); d = new Date(d.getFullYear(), d.getMonth() + 1, 1);
    const every = total > 400 ? 3 : 1;
    for (; indexOf(d) < z; d = new Date(d.getFullYear(), d.getMonth() + every, 1)) {
      marks += `<div class="smark" style="left:${pct(indexOf(d))}%">${esc(T.months[d.getMonth()].slice(0, 3))}${d.getMonth() === 0 ? ' ' + d.getFullYear() : ''}</div>`;
    }
    const left = Math.max(0, Math.min(100, pct(i0))), width = Math.min(100 - left, (n / total) * 100);
    $('scrub').innerHTML = `<div class="strack" id="strack">${marks}${ticks}<div class="stoday" style="left:${pct(todayI)}%"></div><div class="sthumb" id="sthumb" style="left:${left}%;width:${width}%"></div></div>`;
  };
  // Træk: vinduets midte følger musen/fingeren
  let scrubbing = false, raf = 0;
  const scrubTo = clientX => {
    const track = $('strack'); if (!track || !data) return;
    const rect = track.getBoundingClientRect(), { a, z } = span();
    const n = periodLen(start, zoom);
    const day = a + ((clientX - rect.left) / rect.width) * (z - a);
    start = Math.round(Math.max(a, Math.min(z - n, day - n / 2)));
    cancelAnimationFrame(raf); raf = requestAnimationFrame(render);
  };
  $('scrub').addEventListener('pointerdown', e => { if (!e.target.closest('.strack')) return; scrubbing = true; e.currentTarget.setPointerCapture(e.pointerId); scrubTo(e.clientX); });
  $('scrub').addEventListener('pointermove', e => { if (scrubbing) scrubTo(e.clientX); });
  $('scrub').addEventListener('pointerup', () => { scrubbing = false; });
  $('scrub').addEventListener('pointercancel', () => { scrubbing = false; });

  const render = () => {
    $('loading').hidden = true; $('invalid').hidden = true; $('view').hidden = false;
    document.title = data.folder;
    $('org').textContent = data.organization || '';
    $('folder').textContent = data.folder;
    $('project').textContent = data.project && data.project !== data.folder ? T.project(data.project) : '';
    $('today').textContent = T.today;
    $('zooms').innerHTML = ZOOMS.map(z => `<button data-z="${z.id}" class="${z.id === zoom ? 'on' : ''}">${z.label}</button>`).join('');

    const i0 = start, n = periodLen(start, zoom), todayI = indexOf(now);
    $('month').textContent = periodLabel(i0, n);
    const sc = document.querySelector('.scroller');
    const DW = Math.max(4, (sc.clientWidth - LABEL_W() - 1) / n);
    const mode = DW >= 26 ? 'full' : DW >= 16 ? 'num' : 'tiny';
    const rowColor = Object.fromEntries(data.rows.map(r => [r.id, r.color]));
    const visible = data.bookings.filter(b => b.start_day <= i0 + n - 1 && b.start_day + Math.max(1, b.duration) - 1 >= i0);
    const dayCells = h => { let d = ''; for (let k = 0; k < n; k++) { const wd = (dateOf(i0 + k).getDay() + 6) % 7; d += `<div class="day${wd >= 5 ? ' we' : ''}${wd === 4 ? ' fri' : wd === 6 ? ' sun' : ''}${wd === 0 ? ' mon' : ''}" style="height:${h}px"></div>`; } return d; };

    // Tre rækker som i appen (Nicolai 2026-11-15): måneder ("NOV 26"), ugenumre og dagens tal. Ved 3 og 6 måneder er
    // dagsrækken tom. Et stykke tekst vises kun, når der er plads til det
    const segRow = (cls, startOf, text) => {
      let k = 0, segs = '';
      while (k < n) {
        const len = Math.min(n, startOf(k)) - k;
        segs += `<div class="mseg" style="width:${len * DW}px">${len * DW > 22 ? esc(text(dateOf(i0 + k))) : ''}</div>`;
        k += len;
      }
      return `<div class="head ${cls}"><div class="label"></div><div class="days">${segs}</div></div>`;
    };
    const monthRow = segRow('months', k => { const d = dateOf(i0 + k); return indexOf(new Date(d.getFullYear(), d.getMonth() + 1, 1)) - i0; },
      d => `${T.mShort[d.getMonth()]} ${String(d.getFullYear()).slice(-2)}`);
    const weekRow = segRow('weeks', k => k + 7 - ((dateOf(i0 + k).getDay() + 6) % 7), d => String(isoWeek(d)));
    const showDays = months(zoom) < 3 && mode !== 'tiny';
    let head = `<div class="head"><div class="label"></div><div class="days">`;
    const is1d = zoom === '1d';
    for (let k = 0; k < n; k++) {
      const d = dateOf(i0 + k), wd = (d.getDay() + 6) % 7;
      const txt = is1d ? `<span class="h1date">${d.getDate()}.</span>${Array.from({ length: 24 }, (_, h) => `<span class="h1hour" style="left:${DW * h / 24}px">${String(h).padStart(2, '0')}</span>`).join('')}`
        : showDays ? `<b>${d.getDate()}</b>` : '&nbsp;';
      head += `<div class="day${wd >= 5 ? ' we' : ''}${wd === 4 ? ' fri' : wd === 6 ? ' sun' : ''}${wd === 0 ? ' mon' : ''}${i0 + k === todayI ? ' today' : ''}">${txt}</div>`;
    }
    head += `</div></div>`;

    // En række pr. række i mappen; en booking med kobling vises også på den koblede række (som i appen)
    let rows = '';
    for (const r of data.rows) {
      const list = visible.filter(b => b.row_id === r.id || b.linked_row_id === r.id).map(b => {
        const sM = mins(b.start_time), eM = mins(b.end_time);
        const s = b.start_day + (sM != null ? sM / 1440 : 0);
        const e = b.start_day + Math.max(1, b.duration) - 1 + (eM != null ? eM / 1440 : 1);
        return { b, s: Math.max(s, i0), e: Math.min(e, i0 + n) };
      }).sort((a, c) => a.s - c.s);
      // Spor, så overlappende bookinger ligger under hinanden
      const lanes = [];
      for (const x of list) { let l = lanes.findIndex(end => end <= x.s + 1e-6); if (l < 0) { l = lanes.length; lanes.push(0); } lanes[l] = x.e; x.lane = l; }
      const LANE = 36;   // 32 px bjælke + 4 px luft
      const h = Math.max(1, lanes.length) * LANE + 8;
      const bars = list.map(x => {
        const color = x.b.color || rowColor[x.b.row_id] || '#888888';
        const left = (x.s - i0) * DW + 1, width = Math.max(4, (x.e - x.s) * DW - 2);
        return `<div class="bar" style="left:${left}px;width:${width}px;top:${6 + x.lane * LANE}px;background:${esc(color)};${width < 26 ? 'padding:0' : ''}" title="${esc(barParts(x.b).join(' · '))}">${width >= 26 ? barText(x.b) : ''}</div>`;
      }).join('');
      const line = todayI >= i0 && todayI < i0 + n ? `<div class="todayLine" style="left:${(todayI - i0 + (now.getHours() * 60 + now.getMinutes()) / 1440) * DW}px"></div>` : '';
      rows += `<div class="row"><div class="label"><span class="dot${r.category === 'studio' ? ' studio' : ''}" style="background:${esc(r.color || '#888')}"></span><span>${esc(r.label)}</span></div><div class="days">${dayCells(h)}${bars}${line}</div></div>`;
    }
    // En tom række under den sidste (Nicolai), samme højde som en række med én bjælke
    if (data.rows.length) rows += `<div class="row"><div class="label"></div><div class="days">${dayCells(44)}</div></div>`;
    const grid = $('grid');
    grid.style.setProperty('--dw', DW + 'px');
    // Timestregerne i hele pixels, som appens gridBg1D (WebKit rammer ikke procenter præcist)
    const hourStops = c => { const st = []; for (let i = 1; i < 24; i++) { const x = Math.round(i / 24 * DW); st.push(`transparent ${x - 1}px`, `var(${c}) ${x - 1}px`, `var(${c}) ${x}px`, `transparent ${x}px`); } return `linear-gradient(to right, ${st.join(', ')})`; };
    grid.style.setProperty('--hours', is1d ? hourStops('--hourLine') : 'none');
    grid.style.setProperty('--hoursHead', is1d ? hourStops('--hourLineHead') : 'none');
    grid.className = `grid ${mode}${is1d ? ' h1d' : ''}`;
    grid.innerHTML = monthRow + weekRow + head + (data.rows.length ? rows : `<div class="empty">${T.none}</div>`);

    renderScrubber(i0, n);
    $('foot').textContent = [T.readOnly, data.expires_at ? T.expires(new Date(data.expires_at).toLocaleDateString(locale, { day: 'numeric', month: 'long', year: 'numeric' })) : ''].filter(Boolean).join(' ');
  };

  $('prev').onclick = () => { start = shiftStart(start, zoom, -1); render(); };
  $('next').onclick = () => { start = shiftStart(start, zoom, 1); render(); };
  $('today').onclick = () => { start = periodStart(now, zoom); render(); };
  $('zooms').onclick = e => {
    const z = e.target.closest('button')?.dataset.z;
    if (!z || z === zoom) return;
    // Bliv omkring det sted, man kigger på (i dag, hvis det er i perioden)
    const n = periodLen(start, zoom), todayI = indexOf(now);
    const anchor = todayI >= start && todayI < start + n ? now : dateOf(start);
    zoom = z; lsSet('projektZoom', z); start = periodStart(anchor, zoom); render();
  };
  let rt; window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => data && render(), 120); });

  load();
  setInterval(load, 60000);
  window.addEventListener('focus', load);
})();
</script>
</body>
</html>
