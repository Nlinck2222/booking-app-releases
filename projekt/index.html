<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Projektmappe</title>
<!--
  Delt projektmappe (booking-appens v895, src/projectShare.tsx, migration 061). Udgives med scripts/publish-reply-page.sh
  til GitHub Pages (Nlinck2222/booking-app-releases → /projekt/). Linket har ?k=<token>. Kun visning: siden kalder
  get_shared_project med den offentlige nøgle og får kun mappens rækker og bookinger — ingen kunder, priser eller noter.
  Kun tidslinjen (Nicolai: listen under behøves ikke). Henter igen hvert minut og når fanen får fokus. Dag-indeks fra mandag 30. dec 2024, som i appen.
-->
<style>
  :root { --bg: #f5f5f7; --card: #ffffff; --text: #1d1d1f; --muted: #6e6e73; --line: #e3e3e6; --grid: #eeeef0; --weekend: #f7f7f9;
          --today: #e5484d; --barText: #ffffff; --btn: #f0f0f2; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111113; --card: #1c1c1f; --text: #f5f5f7; --muted: #a1a1a6; --line: #2c2c30; --grid: #26262a; --weekend: #202024;
            --today: #ff6b6b; --barText: #ffffff; --btn: #2a2a2e; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  main { max-width: 1200px; margin: 0 auto; padding: 32px 16px 48px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; }
  .msg { max-width: 460px; margin: 40px auto; padding: 28px 24px; }
  header { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px 24px; margin: 0 0 16px; }
  .org { font-size: 13px; color: var(--muted); margin: 0 0 2px; }
  h1 { font-size: 22px; margin: 0; line-height: 1.25; }
  .sub { font-size: 13px; color: var(--muted); margin: 2px 0 0; }
  .nav { display: flex; align-items: center; gap: 6px; margin-left: auto; }
  .nav button { border: 1px solid var(--line); background: var(--btn); color: var(--text); border-radius: 6px; height: 30px; min-width: 30px; padding: 0 10px; font: inherit; font-weight: 600; cursor: pointer; }
  .nav .month { min-width: 130px; text-align: center; font-weight: 700; }
  :root { color-scheme: light dark; }
  .scroller { overflow-x: auto; -webkit-overflow-scrolling: touch; background: var(--card); border-radius: 12px; }
  .grid { position: relative; min-width: max-content; }
  .head, .row { display: flex; border-bottom: 1px solid var(--line); }
  .row:last-child { border-bottom: none; }
  .row.pad, .row:has(+ .row.pad) { border-bottom: none; }
  .row.pad .label { padding: 0; }
  .label { position: sticky; left: 0; z-index: 3; flex: 0 0 150px; width: 150px; padding: 8px 12px; background: var(--card); border-right: 1px solid var(--line);
           display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 13px; overflow: hidden; }
  .label span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dot { flex: 0 0 9px; width: 9px; height: 9px; border-radius: 50%; }
  .dot.studio { border-radius: 2px; }
  .days { position: relative; display: flex; }
  .day { flex: 0 0 var(--dw); width: var(--dw); border-right: 1px solid var(--grid); }
  .day.we { background: var(--weekend); }
  .head .day { text-align: center; font-size: 11px; color: var(--muted); padding: 6px 0; line-height: 1.2; }
  .head .day b { display: block; font-size: 12px; color: var(--text); }
  .head .day.today b { color: var(--today); }
  .todayLine { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--today); opacity: .6; z-index: 2; pointer-events: none; }
  .bar { position: absolute; height: 24px; border-radius: 4px; color: var(--barText); font-size: 11px; font-weight: 600; padding: 0 7px;
         display: flex; align-items: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; z-index: 1;
         box-shadow: inset 0 -1px 0 rgba(0,0,0,.15); text-shadow: 0 1px 1px rgba(0,0,0,.25); }
  .bar .ep { opacity: .85; font-weight: 500; margin-left: 5px; }
  .empty { padding: 24px; color: var(--muted); }
  .foot { margin-top: 18px; font-size: 12px; color: var(--muted); }
  @media (max-width: 600px) {
    .label { flex-basis: 110px; width: 110px; padding: 8px; }
    .nav { margin-left: 0; width: 100%; }
    .nav .month { flex: 1; }
  }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <div id="loading" class="card msg" style="color: var(--muted)">…</div>
  <div id="invalid" class="card msg" hidden>
    <h1 id="invalidTitle"></h1>
    <p class="sub" id="invalidText" style="font-size:14px; margin-top:8px"></p>
  </div>
  <div id="view" hidden>
    <header>
      <div>
        <p class="org" id="org"></p>
        <h1 id="folder"></h1>
        <p class="sub" id="project"></p>
      </div>
      <div class="nav">
        <button id="prev" aria-label="‹">‹</button>
        <div class="month" id="month"></div>
        <button id="next" aria-label="›">›</button>
        <button id="today"></button>
      </div>
    </header>
    <div class="card scroller"><div class="grid" id="grid"></div></div>
    <p class="foot" id="foot"></p>
  </div>
</main>
<script>
(() => {
  const SUPABASE_URL = 'https://roiwjhggrtmwppbaqxtd.supabase.co';
  const PUBLIC_KEY = 'sb_publishable_IzZ68IhECcV2T50QwpNqfg_vkfZxoZS';
  const params = new URLSearchParams(location.search);
  const token = params.get('k') || '';
  const lang = (params.get('l') || navigator.language || 'da').toLowerCase().startsWith('da') ? 'da' : 'en';
  document.documentElement.lang = lang;
  const T = {
    da: { invalidTitle: 'Linket virker ikke længere', invalidText: 'Det er måske stoppet eller udløbet. Kontakt den, der delte det med dig.',
          today: 'I dag', none: 'Ingen bookinger i denne måned.', project: p => `Projekt: ${p}`,
          expires: d => `Linket udløber ${d}.`, readOnly: 'Kun visning. Siden opdaterer sig selv.', 
          months: ['Januar','Februar','Marts','April','Maj','Juni','Juli','August','September','Oktober','November','December'],
          wd: ['Ma','Ti','On','To','Fr','Lø','Sø'] },
    en: { invalidTitle: 'This link no longer works', invalidText: 'It may have been stopped or expired. Contact the person who shared it with you.',
          today: 'Today', none: 'No bookings this month.', project: p => `Project: ${p}`,
          expires: d => `The link expires ${d}.`, readOnly: 'View only. The page updates itself.', 
          months: ['January','February','March','April','May','June','July','August','September','October','November','December'],
          wd: ['Mo','Tu','We','Th','Fr','Sa','Su'] },
  }[lang];
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const EPOCH = new Date(2024, 11, 30);   // tidslinjens dag 0 (mandag), som booking-appen
  const dateOf = i => new Date(EPOCH.getFullYear(), EPOCH.getMonth(), EPOCH.getDate() + i);
  const indexOf = d => Math.round((new Date(d.getFullYear(), d.getMonth(), d.getDate()) - EPOCH) / 86400000);
  const DW = window.innerWidth < 600 ? 30 : 36;   // dagbredde i px
  const mins = t => { if (!t) return null; const [h, m] = t.split(':').map(Number); return isNaN(h) ? null : h * 60 + (m || 0); };

  let data = null;
  const now = new Date();
  let view = { y: now.getFullYear(), m: now.getMonth() };

  const showInvalid = () => {
    $('loading').hidden = true; $('view').hidden = true; $('invalid').hidden = false;
    $('invalidTitle').textContent = T.invalidTitle; $('invalidText').textContent = T.invalidText; document.title = T.invalidTitle;
  };

  const load = async () => {
    if (!token) return showInvalid();
    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/get_shared_project`, {
        method: 'POST', headers: { apikey: PUBLIC_KEY, 'Content-Type': 'application/json' }, body: JSON.stringify({ p_token: token }),
      });
      if (!res.ok) throw new Error(res.status);
      const d = await res.json();
      if (!d) return showInvalid();
      const first = !data;
      data = d;
      if (first) {
        // Åbn ved den første kommende booking, hvis måneden er tom
        const todayI = indexOf(now);
        const inMonth = d.bookings.some(b => { const s = dateOf(b.start_day); return s.getFullYear() === view.y && s.getMonth() === view.m; });
        const next = d.bookings.find(b => b.start_day + b.duration > todayI);
        if (!inMonth && next) { const s = dateOf(next.start_day); view = { y: s.getFullYear(), m: s.getMonth() }; }
      }
      render();
    } catch (e) {
      if (!data) showInvalid();
    }
  };

  const barText = b => `${esc(b.label || '')}${b.episode ? `<span class="ep">${esc(b.episode)}</span>` : ''}${b.work_type ? `<span class="ep">· ${esc(b.work_type)}</span>` : ''}`;

  const render = () => {
    $('loading').hidden = true; $('invalid').hidden = true; $('view').hidden = false;
    document.title = data.folder;
    $('org').textContent = data.organization || '';
    $('folder').textContent = data.folder;
    $('project').textContent = data.project && data.project !== data.folder ? T.project(data.project) : '';
    $('month').textContent = `${T.months[view.m]} ${view.y}`;
    $('today').textContent = T.today;

    const first = new Date(view.y, view.m, 1), last = new Date(view.y, view.m + 1, 0);
    const i0 = indexOf(first), n = last.getDate(), todayI = indexOf(now);
    const rowColor = Object.fromEntries(data.rows.map(r => [r.id, r.color]));
    const visible = data.bookings.filter(b => b.start_day <= i0 + n - 1 && b.start_day + Math.max(1, b.duration) - 1 >= i0);

    // Dagkolonnerne
    let head = `<div class="head"><div class="label"></div><div class="days">`;
    for (let k = 0; k < n; k++) {
      const d = dateOf(i0 + k), wd = (d.getDay() + 6) % 7;
      head += `<div class="day${wd >= 5 ? ' we' : ''}${i0 + k === todayI ? ' today' : ''}">${T.wd[wd]}<b>${d.getDate()}</b></div>`;
    }
    head += `</div></div>`;

    // En række pr. række i mappen; en booking med kobling vises også på den koblede række (som i appen)
    let rows = '';
    for (const r of data.rows) {
      const list = visible.filter(b => b.row_id === r.id || b.linked_row_id === r.id).map(b => {
        const sM = mins(b.start_time), eM = mins(b.end_time);
        const s = b.start_day + (sM != null ? sM / 1440 : 0);
        const e = b.start_day + Math.max(1, b.duration) - 1 + (eM != null ? eM / 1440 : 1);
        return { b, s: Math.max(s, i0), e: Math.min(e, i0 + n) };
      }).sort((a, c) => a.s - c.s);
      // Spor, så overlappende bookinger ligger under hinanden
      const lanes = [];
      for (const x of list) { let l = lanes.findIndex(end => end <= x.s + 1e-6); if (l < 0) { l = lanes.length; lanes.push(0); } lanes[l] = x.e; x.lane = l; }
      const h = Math.max(1, lanes.length) * 28 + 8;
      let days = '';
      for (let k = 0; k < n; k++) { const wd = (dateOf(i0 + k).getDay() + 6) % 7; days += `<div class="day${wd >= 5 ? ' we' : ''}" style="height:${h}px"></div>`; }
      const bars = list.map(x => {
        const color = x.b.color || rowColor[x.b.row_id] || '#888888';
        const left = (x.s - i0) * DW + 2, width = Math.max(14, (x.e - x.s) * DW - 4);
        return `<div class="bar" style="left:${left}px;width:${width}px;top:${6 + x.lane * 28}px;background:${esc(color)}" title="${esc(x.b.label || '')}">${barText(x.b)}</div>`;
      }).join('');
      const line = todayI >= i0 && todayI < i0 + n ? `<div class="todayLine" style="left:${(todayI - i0 + (now.getHours() * 60 + now.getMinutes()) / 1440) * DW}px"></div>` : '';
      rows += `<div class="row"><div class="label"><span class="dot${r.category === 'studio' ? ' studio' : ''}" style="background:${esc(r.color || '#888')}"></span><span>${esc(r.label)}</span></div><div class="days">${days}${bars}${line}</div></div>`;
    }
    // Luft over første og under sidste række (Nicolai) — samme dagkolonner, så gitter og weekender fortsætter
    const pad = () => { let d = ''; for (let k = 0; k < n; k++) { const wd = (dateOf(i0 + k).getDay() + 6) % 7; d += `<div class="day${wd >= 5 ? ' we' : ''}" style="height:12px"></div>`; } return `<div class="row pad"><div class="label"></div><div class="days">${d}</div></div>`; };
    if (data.rows.length) rows = pad() + rows + pad();
    const grid = $('grid');
    grid.style.setProperty('--dw', DW + 'px');
    grid.innerHTML = head + (data.rows.length ? rows : `<div class="empty">${T.none}</div>`);

    $('foot').textContent = [T.readOnly, data.expires_at ? T.expires(new Date(data.expires_at).toLocaleDateString(lang === 'da' ? 'da-DK' : 'en-GB', { day: 'numeric', month: 'long', year: 'numeric' })) : ''].filter(Boolean).join(' ');

    // Rul tidslinjen hen til i dag, når den er i måneden
    const sc = document.querySelector('.scroller');
    if (!sc.dataset.scrolled) { sc.dataset.scrolled = '1'; sc.scrollLeft = todayI >= i0 && todayI < i0 + n ? Math.max(0, (todayI - i0 - 3) * DW) : 0; }
  };

  const shift = d => { view = { y: view.m + d < 0 ? view.y - 1 : view.m + d > 11 ? view.y + 1 : view.y, m: (view.m + d + 12) % 12 }; document.querySelector('.scroller').dataset.scrolled = ''; render(); };
  $('prev').onclick = () => shift(-1);
  $('next').onclick = () => shift(1);
  $('today').onclick = () => { view = { y: now.getFullYear(), m: now.getMonth() }; document.querySelector('.scroller').dataset.scrolled = ''; render(); };

  load();
  setInterval(load, 60000);
  window.addEventListener('focus', load);
})();
</script>
</body>
</html>
